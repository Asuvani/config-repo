eureka.instance.hostname=localhost
spring.application.name=registration-service
spring.datasource.url=jdbc:mysql://localhost:3306/patient_registration_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom path for Swagger UI
springdoc.swagger-ui.path=/custom-swagger.html

# Custom path for the JSON OpenAPI definition
springdoc.api-docs.path=/custom-api-docs

spring.email.url= http://EMAIL-SERVICE/email/sendEmail



#management.otlp.tracing.endpoint= http://collector:4318/v1/traces

# ===================================================================
# Logging Levels (Hierarchy: TRACE < DEBUG < INFO < WARN < ERROR)
# ===================================================================

# Set the global root logger level (Defaults to INFO if not set)
logging.level.root=INFO

# Set granular log levels for specific packages or classes
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=WARN
management.otlp.metrics.export.enabled=false

# Trace 100% of requests (default is 0.1 / 10%)
management.tracing.sampling.probability=1.0

# Optional: Customize how traceId and spanId appear in console logs
# (Spring Boot 4 prints [traceId-spanId] automatically, or use this format:)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]


# ===================================================================
# File Logging Options
# ===================================================================

# Route log files out to a specific file path and name
logging.file.name=logs/patient.log

# ===================================================================
# Structured JSON Logging (Available in Spring Boot 3.4+)
# ===================================================================

# Converts standard logs into structured Elastic Common Schema (ECS) JSON format
logging.structured.format.console=ecs

eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.instance.prefer-ip-address= true


management.endpoints.web.exposure.include=health, metrics

resilience4j.circuitbreaker.instances.emailExternalService.registerHealthIndicator= true
resilience4j.circuitbreaker.instances.emailExternalService.slidingWindowType= COUNT_BASED
resilience4j.circuitbreaker.instances.emailExternalService.slidingWindowSize= 10
resilience4j.circuitbreaker.instances.emailExternalService.minimumNumberOfCalls= 2
resilience4j.circuitbreaker.instances.emailExternalService.failureRateThreshold= 50
resilience4j.circuitbreaker.instances.emailExternalService.waitDurationInOpenState= 10s
resilience4j.circuitbreaker.instances.emailExternalService.permittedNumberOfCallsInHalfOpenState= 2
management.health.circuitbreakers.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=true


# JWT public key
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public-key.pem